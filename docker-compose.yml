services:

  frontend:
    image: node:20
    container_name: repairservice_frontend

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "5173:5173"

    command: sh -c "npm install && npm run dev -- --host"

  backend:
    image: php:8.4-cli
    container_name: repairservice_backend

    working_dir: /app

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: repairservice_mysql

    restart: always

    environment:
      MYSQL_DATABASE: repair_service
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: